name: Deploy to EdgeOne Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # 支持手动触发
    inputs:
      area:
        description: 'Deploy area (optional, overrides repo variable)'
        required: false
        type: choice
        options:
          - ''
          - global
          - overseas
      env:
        description: 'Environment'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - preview

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install project dependencies
        run: npm ci

      # ---------------------------------------------
      # 安装指定版本的 edgeone CLI
      # 版本号来自 Variables (vars.EDGEONE_CLI_VERSION)，回退到默认值
      # ---------------------------------------------
      - name: Install edgeone CLI
        run: npm install -g edgeone@${{ vars.EDGEONE_CLI_VERSION || '1.4.5-beta.1' }}

      - name: Verify CLI version
        run: edgeone --version

      - name: Build & Deploy to EdgeOne Pages
        env:
          # 📋 Variables：可配置的非敏感参数，未设置时使用默认值
          # 针对 GitHub Actions 跨境网络的上传优化参数
          COS_CHUNK_SIZE_MB: ${{ vars.COS_CHUNK_SIZE_MB || '8' }}
          COS_CHUNK_PARALLEL_LIMIT: ${{ vars.COS_CHUNK_PARALLEL_LIMIT || '8' }}
          COS_CHUNK_RETRY_TIMES: ${{ vars.COS_CHUNK_RETRY_TIMES || '2' }}
          COS_FILE_PARALLEL_LIMIT: ${{ vars.COS_FILE_PARALLEL_LIMIT || '10' }}
        run: |
          # 优先级：手动触发时的 inputs > Variables > 默认值
          AREA="${{ github.event.inputs.area || vars.EDGEONE_AREA || 'global' }}"
          ENV_NAME="${{ github.event.inputs.env || 'production' }}"
          PROJECT_NAME="${{ vars.EDGEONE_PROJECT_NAME || 'next-mix-test-corbin' }}"

          echo "==> Deploying project: $PROJECT_NAME"
          echo "==> Area: $AREA, Environment: $ENV_NAME"

          edgeone pages deploy \
            --name next-mix-test-corbin \
            --area "$AREA" \
            --env "$ENV_NAME" \
            --token "${{ secrets.EDGEONE_API_TOKEN }}"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-logs-${{ github.run_id }}
          path: |
            .edgeone/
            ~/.npm/_logs/
          retention-days: 7
          if-no-files-found: ignore
