name: Deploy to EdgeOne Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # 支持手动触发
    inputs:
      area:
        description: 'Deploy area (optional, overrides repo variable)'
        required: false
        type: choice
        options:
          - ''
          - global
          - overseas
      env:
        description: 'Environment'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - preview

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install project dependencies
        run: npm ci

      # ---------------------------------------------
      # 安装指定版本的 edgeone CLI
      # 版本号来自 Variables (vars.EDGEONE_CLI_VERSION)，回退到默认值
      # ---------------------------------------------
      - name: Install edgeone CLI
        run: npm install -g edgeone@${{ vars.EDGEONE_CLI_VERSION || '1.4.5-beta.1' }}

      - name: Verify CLI version
        run: edgeone --version

      - name: Build & Deploy to EdgeOne Pages
        env:
          # 📋 Variables：可配置的非敏感参数，未设置时使用默认值
          # 针对 GitHub Actions 跨境网络优化的保守参数（默认值）
          COS_CHUNK_SIZE_MB: ${{ vars.COS_CHUNK_SIZE_MB || '2' }}
          COS_CHUNK_PARALLEL_LIMIT: ${{ vars.COS_CHUNK_PARALLEL_LIMIT || '3' }}
          COS_CHUNK_RETRY_TIMES: ${{ vars.COS_CHUNK_RETRY_TIMES || '5' }}
          COS_FILE_PARALLEL_LIMIT: ${{ vars.COS_FILE_PARALLEL_LIMIT || '5' }}
          # 强制以非 TTY 模式输出日志（避免 ANSI 控制码导致 runner 日志异常）
          FORCE_NON_TTY: '1'
        run: |
          # 优先级：手动触发时的 inputs > Variables > 默认值
          AREA="${{ github.event.inputs.area || vars.EDGEONE_AREA || 'global' }}"
          ENV_NAME="${{ github.event.inputs.env || 'production' }}"
          PROJECT_NAME="${{ vars.EDGEONE_PROJECT_NAME || 'next-mix-test-corbin' }}"

          echo "==> Deploying project: $PROJECT_NAME"
          echo "==> Area: $AREA, Environment: $ENV_NAME"
          echo "==> Upload config: CHUNK_SIZE=${COS_CHUNK_SIZE_MB}MB, CHUNK_PARALLEL=${COS_CHUNK_PARALLEL_LIMIT}, RETRY=${COS_CHUNK_RETRY_TIMES}, FILE_PARALLEL=${COS_FILE_PARALLEL_LIMIT}"

          edgeone pages deploy \
            --name "$PROJECT_NAME" \
            --area "$AREA" \
            --env "$ENV_NAME" \
            --token "${{ secrets.EDGEONE_API_TOKEN }}"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-logs-${{ github.run_id }}
          path: |
            .edgeone/
            ~/.npm/_logs/
          retention-days: 7
          if-no-files-found: ignore
